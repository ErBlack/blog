name: Deploy

on:
  push:
    branches: ["main"]

  schedule:
    - cron: '47 9 * * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      build-time: ${{ steps.build-time.outputs.value }}
    steps:
      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: |
            _site/posts/*/*.avif
            _site/posts/*/*.webp
            _site/posts/*/*.jpeg
          key: images-${{ hashFiles('blog/posts/*/*.11tydata.json') }}
          restore-keys: images-
      - run: npm run build
        env:
          BUILD_TIME: ${{ steps.build-time.outputs.value }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  telegram:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch previous commit
        if: github.event_name == 'push'
        continue-on-error: true
        run: git fetch --depth=1 origin ${{ github.event.before }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node lib/scripts/telegram.ts ${{ github.event.before }}
        env:
          BUILD_TIME: ${{ needs.deploy.outputs.build-time }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
