name: Deploy

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/cache@v4
        with:
          path: |
            _site/posts/*/*.avif
            _site/posts/*/*.webp
            _site/posts/*/*.jpeg
          key: images-${{ hashFiles('blog/posts/*/*.11tydata.json') }}
          restore-keys: images-
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
